# Sentinel production deployment (see agent/docs/DEPLOYMENT.md).
#
#   cp .env.example .env      # fill in NVIDIA_API_KEY + SENTINEL_DOMAIN
#   docker compose up -d --build
#
# Caddy issues and renews the TLS certificate automatically.
#
# All persistent state lives in ./data on the host (reports/, users.db,
# tokens, dashboard-created configs) - one directory to back up.

services:
  web:
    build: .
    image: sentinel-agent:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Only Caddy is a trusted proxy hop (ProxyFix reads X-Forwarded-*).
      FORWARDED_ALLOW_IPS: caddy
      SENTINEL_DATA_DIR: /data
      SENTINEL_CONFIG_DIR: /data/configs
      # Phase 3 launch safety (see agent/docs/DEPLOYMENT.md):
      # block private/loopback/metadata scan targets.
      SENTINEL_PUBLIC_MODE: "1"
      # Per-user daily scan quota (0 disables).
      SENTINEL_DAILY_SCAN_LIMIT: "20"
      # Leave unset for invite-only signup; set to 1 on private/firewalled
      # deployments to let anyone register.
      SENTINEL_OPEN_SIGNUP: ""
      # Published abuse channel (/abuse page) - set a real address before launch.
      SENTINEL_ABUSE_EMAIL: ${SENTINEL_ABUSE_EMAIL:-abuse@${SENTINEL_DOMAIN}}
    expose:
      - "8000"
    volumes:
      - ./data:/data
    # Scans spawn Chromium and run for minutes - generous stop grace.
    stop_grace_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SENTINEL_DOMAIN: ${SENTINEL_DOMAIN:?set SENTINEL_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data: {}
  caddy_config: {}
