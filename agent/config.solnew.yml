# QA Agent config for https://sol.new — v1 acceptance scan.
# Deterministic probes only (--skip-llm); scope is hard-limited to this origin.

target: https://sol.new

scope:
  allowed_origins:
    - https://sol.new
  excluded_paths: []
  max_requests_per_minute: 60
  timeout_seconds: 30

llm:
  model: meta/llama-3.3-70b-instruct
  api_key_env: NVIDIA_API_KEY
  api_base: https://integrate.api.nvidia.com/v1
  temperature: 0.0
  max_tokens: 1024

agent:
  max_steps: 25
  headless: true
  browser_channel: msedge
  output_dir: reports
