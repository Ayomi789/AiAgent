[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qaagent"
version = "0.1.0"
description = "AI agent that tests websites and apps for vulnerabilities, bugs, and broken functionality."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.45",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
targets = [
    "flask>=3.0",
]

[project.scripts]
qaagent = "qaagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qaagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
