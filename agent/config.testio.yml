# TestIO staging (behind the corporate forward proxy).
target: https://testio-dxengineering-stage.summit.network

scope:
  allowed_origins:
    - https://testio-dxengineering-stage.summit.network
  excluded_paths: []
  max_requests_per_minute: 30
  timeout_seconds: 30

proxy:
  server: http://forward.test.io:3128

agent:
  max_steps: 25
  headless: true
  browser_channel: msedge
  output_dir: reports
